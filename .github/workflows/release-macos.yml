name: Release macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of overlapping when several merges land close together
concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app into Uno WebContent
        working-directory: web
        run: |
          npm ci
          npm run build:uno

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*<ApplicationDisplayVersion>\(.*\)<\/ApplicationDisplayVersion>.*/\1/p' uno/AppUno/AppUno.csproj)
          : "${VERSION:=1.0}"
          echo "version=${VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish macOS (arm64)
        working-directory: uno
        run: |
          dotnet publish AppUno/AppUno.csproj \
            -f net10.0-desktop \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:TargetFrameworks=net10.0-desktop \
            -p:PackageFormat=app

      - name: Publish macOS (x64)
        working-directory: uno
        run: |
          dotnet publish AppUno/AppUno.csproj \
            -f net10.0-desktop \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -p:TargetFrameworks=net10.0-desktop \
            -p:PackageFormat=app

      - name: Zip app bundles
        run: |
          ARM_PUBLISH=uno/AppUno/bin/Release/net10.0-desktop/osx-arm64/publish
          X64_PUBLISH=uno/AppUno/bin/Release/net10.0-desktop/osx-x64/publish
          ditto -c -k --sequesterRsrc --keepParent "$ARM_PUBLISH/AppUno.app" "AppUno-macos-arm64-v${{ steps.version.outputs.version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$X64_PUBLISH/AppUno.app" "AppUno-macos-x64-v${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: macOS v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            AppUno-macos-arm64-v${{ steps.version.outputs.version }}.zip
            AppUno-macos-x64-v${{ steps.version.outputs.version }}.zip
